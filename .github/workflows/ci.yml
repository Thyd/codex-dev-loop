name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate packaged skills
        run: python scripts/validate_skill_package.py
      - name: Compile Python modules
        run: python -m compileall -q scripts
      - name: Run fast pytest suites
        run: python -m pytest -q -m "not slow"
      - name: Run slow integration suites
        run: python -m pytest -q -m slow
